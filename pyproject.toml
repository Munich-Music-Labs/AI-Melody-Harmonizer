[project]
name = "ai-melody-harmonizer"
version = "0.1.0"
description = "Generate chord progressions from a melody with flexible harmonic rhythm and controllable harmonic density."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "matplotlib>=3.10.8",
    "music21>=9.1.0",
    "numpy>=2.0.0",
    "python-multipart>=0.0.9",
    "samplings>=0.1.7",
    "tensorflow>=2.18.0",
    "tqdm>=4.66.1",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cuda-nvrtc-cu12>=12.9.86",
    "nvidia-cudnn-cu12>=9.20.0.48",
]
